<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Akademik | Schedy</title>
    <link rel="stylesheet" th:href="@{/css/Data_Akademik_Admin.css}">
</head>
<body>
    <aside class="sidebar">
        <a class="brand" href="Dashboard_Admin.html">Schedy</a>
        <nav class="main-navigation" aria-label="Navigasi utama">
            <a class="nav-link" href="Dashboard_Admin.html"><svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="5" height="5" rx=".6"/><rect x="9.5" y="1.5" width="5" height="5" rx=".6"/><rect x="1.5" y="9.5" width="5" height="5" rx=".6"/><rect x="9.5" y="9.5" width="5" height="5" rx=".6"/></svg><span>Dashboard</span></a>
            <a class="nav-link" href="Kelola_Semester_Admin.html"><svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.25" y="3.5" width="11.5" height="10" rx="1"/><path d="M2.5 6.5h11M5 1.75v3.5M11 1.75v3.5"/><path d="M5 9h.01M8 9h.01M11 9h.01M5 11.5h.01M8 11.5h.01"/></svg><span>Kelola Semester</span></a>
            <a class="nav-link" href="Import_CSV_Admin.html"><svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5h5l3 3v10H4z"/><path d="M9 1.5v3M9 4.5h3M8 7v4M6.25 9.25 8 11l1.75-1.75M5.5 13.5h5"/></svg><span>Impor Data CSV</span></a>
            <a class="nav-link active" href="#data-akademik"><svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="3.25" rx="5.25" ry="1.75"/><path d="M2.75 3.25v4C2.75 8.2 5.1 9 8 9s5.25-.8 5.25-1.75v-4M2.75 7.25v4C2.75 12.2 5.1 13 8 13s5.25-.8 5.25-1.75v-4"/></svg><span>Data Akademik</span></a>
        </nav>
        <a class="logout-link" href="#logout"><svg class="logout-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 2H3.25A1.25 1.25 0 0 0 2 3.25v9.5A1.25 1.25 0 0 0 3.25 14h3.25M9.5 5l3 3-3 3M5.5 8h7"/></svg><span>Logout</span></a>
    </aside>

    <div class="page-shell">
        <header class="topbar"><div class="topbar-actions"><label class="semester-select" for="semester-aktif"><select id="semester-aktif" aria-label="Pilih semester aktif"><option>Semester Ganjil 24/25</option></select></label><a class="profile" href="#profile" aria-label="Buka profil admin"><span class="avatar" aria-hidden="true"></span><span class="profile-name">Nama<small>Admin</small></span></a></div></header>
        <main id="data-akademik" class="academic-content">
            <div class="academic-tabs" role="tablist" aria-label="Kategori data akademik"><button class="tab active" type="button" role="tab" aria-selected="true" data-tab="akun">Akun</button><button class="tab" type="button" role="tab" aria-selected="false" data-tab="mata-kuliah">Mata Kuliah</button><button class="tab" type="button" role="tab" aria-selected="false" data-tab="jadwal">Jadwal</button></div>
            <section class="data-card" aria-labelledby="data-title">
                <h1 id="data-title" class="sr-only">Data Akun</h1>
                <div class="data-toolbar"><label class="search-field"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.5" cy="6.5" r="3.5"/><path d="m9.25 9.25 3 3"/></svg><input id="table-search" type="search" placeholder="Cari Akun" aria-label="Cari data"></label><button id="add-button" class="add-button" type="button"><span aria-hidden="true">+</span> Tambah Akun</button></div>
                <div class="table-wrap"><table><thead><tr><th>Nama</th><th>NIP / NPM</th><th>User</th><th><span class="sr-only">Aksi</span></th></tr></thead><tbody id="academic-table-body"></tbody></table></div>
            </section>
        </main>
    </div>

    <div id="account-modal" class="modal" hidden aria-hidden="true"><div class="modal-backdrop" data-close-modal></div><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title">Tambah Akun</h2><button class="close-modal" type="button" aria-label="Tutup" data-close-modal>×</button></div><form id="account-form"><label for="user-type">User</label><div class="select-field"><select id="user-type" required><option>Mahasiswa</option><option>Dosen</option></select></div><label for="full-name">Nama Lengkap</label><input id="full-name" type="text" placeholder="Masukkan Nama" required><label for="account-id">NPM/NIP</label><input id="account-id" type="text" placeholder="contoh: 6182401001" required><div class="modal-actions"><button class="cancel-button" type="button" data-close-modal>Batal</button><button class="save-button" type="submit">Tambahkan</button></div></form></section></div>
    <script src="Data_Akademik_Admin.js"></script>
</body>
</html>
