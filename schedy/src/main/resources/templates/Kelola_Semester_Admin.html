<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Semester | Schedy</title>
    <link rel="stylesheet" th:href="@{/css/Kelola_Semester_Admin.css}">
</head>
<body>
    <aside class="sidebar">
        <a class="brand" href="Dashboard_Admin.html">Schedy</a>
        <nav class="main-navigation" aria-label="Navigasi utama">
            <a class="nav-link" href="Dashboard_Admin.html"><svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="5" height="5" rx=".6"/><rect x="9.5" y="1.5" width="5" height="5" rx=".6"/><rect x="1.5" y="9.5" width="5" height="5" rx=".6"/><rect x="9.5" y="9.5" width="5" height="5" rx=".6"/></svg><span>Dashboard</span></a>
            <a class="nav-link active" href="#kelola-semester"><svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.25" y="3.5" width="11.5" height="10" rx="1"/><path d="M2.5 6.5h11M5 1.75v3.5M11 1.75v3.5"/><path d="M5 9h.01M8 9h.01M11 9h.01M5 11.5h.01M8 11.5h.01"/></svg><span>Kelola Semester</span></a>
            <a class="nav-link" href="Import_CSV_Admin.html"><svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5h5l3 3v10H4z"/><path d="M9 1.5v3M9 4.5h3M8 7v4M6.25 9.25 8 11l1.75-1.75M5.5 13.5h5"/></svg><span>Impor Data CSV</span></a>
            <a class="nav-link" href="Data_Akademik_Admin.html"><svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="3.25" rx="5.25" ry="1.75"/><path d="M2.75 3.25v4C2.75 8.2 5.1 9 8 9s5.25-.8 5.25-1.75v-4M2.75 7.25v4C2.75 12.2 5.1 13 8 13s5.25-.8 5.25-1.75v-4"/></svg><span>Data Akademik</span></a>
        </nav>
        <a class="logout-link" href="#logout"><svg class="logout-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 2H3.25A1.25 1.25 0 0 0 2 3.25v9.5A1.25 1.25 0 0 0 3.25 14h3.25M9.5 5l3 3-3 3M5.5 8h7"/></svg><span>Logout</span></a>
    </aside>

    <div class="page-shell">
        <header class="topbar">
            <div class="topbar-actions">
                <label class="semester-select" for="semester-aktif"><select id="semester-aktif" aria-label="Pilih semester aktif"><option>Semester Ganjil 24/25</option></select></label>
                <a class="profile" href="#profile" aria-label="Buka profil admin"><span class="avatar" aria-hidden="true"></span><span class="profile-name">Nama<small>Admin</small></span></a>
            </div>
        </header>

        <main id="kelola-semester" class="semester-content">
            <div class="page-heading"><h1>Kelola Semester</h1><p>Tambahkan dan kelola periode akademik untuk penjadwalan.</p></div>
            <div class="semester-grid">
                <section class="semester-card add-card" aria-labelledby="add-semester-title">
                    <h2 id="add-semester-title">Tambah Semester Baru</h2>
                    <form>
                        <label for="tahun-ajaran">Tahun Ajaran</label>
                        <div class="field-select"><select id="tahun-ajaran" required><option value="" selected disabled>Masukkan Tahun Ajaran</option><option>2025/2026</option><option>2024/2025</option></select></div>
                        <label for="semester-baru">Semester</label>
                        <div class="field-select"><select id="semester-baru" required><option value="" selected disabled>Pilih Semester</option><option>Ganjil</option><option>Genap</option></select></div>
                        <button type="submit">Tambah Semester <span aria-hidden="true">+</span></button>
                    </form>
                </section>

                <section class="semester-card list-card" aria-labelledby="semester-list-title">
                    <div class="card-heading"><h2 id="semester-list-title">Daftar Semester</h2><span class="count">4 semester</span></div>
                    <ul class="semester-list">
                        <li>2025/2026 Genap</li>
                        <li>2025/2026 Ganjil</li>
                        <li>2024/2025 Genap</li>
                        <li>2024/2025 Ganjil</li>
                    </ul>
                </section>
            </div>
        </main>
    </div>
</body>
</html>
