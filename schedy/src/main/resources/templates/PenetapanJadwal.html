<!DOCTYPE html>
<html lang="id" xmlns="http://thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0"
        rel="stylesheet">

    <title>Document</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/PenetapanJadwal.css}">
</head>

<body>
    <div class="layout">
        <aside th:replace="~{fragments/layoutDosen :: sidebar('PenetapanJadwal')}"></aside>
        <div class="main">
            <header th:replace="~{fragments/layoutDosen :: topbar}"></header>

            <main class="content">
                <div id="card-BuatSlotPresentasi">
                    <div>
                        <h3>Buat Slot Presentasi Baru</h3>
                    </div>
                    <form action="">
                        <div>
                            <label for="" class="text">Mata Kuliah & Kelas</label>
                            <select class="input-MatkulAndKelas" name="idKelas" id="idKelas" required>
                                <option value="" disabled selected>Pilih Mata Kuliah & Kelas</option>
                            </select>
                        </div>

                        <div>
                            <label for="" class="text">Lokasi Ruangan</label>
                            <input type="text" class="input-MatkulAndKelas" name="ruangan" id="ruangan" placeholder="Contoh: Lab Informatika">
                        </div>

                        <div id="wrapp-inputJadwal">
                            <div class="wrapp-input">
                                <div>
                                    <label for="" class="text">Tanggal Presentasi</label>
                                    <input type="date" class="input-jadwal">
                                </div>
                                <div>
                                    <label for="" class="text">Jam Mulai</label>
                                    <input type="time" class="input-jadwal">
                                </div>
                            </div>
                            <div class="wrapp-input">
                                <div>
                                    <label for="" class="text">Durasi</label>
                                    <input type="number" class="input-jadwal" placeholder="30" min="20">
                                </div>
                                <div>
                                    <label for="" class="text">Jam Selesai</label>
                                    <input type="time" class="input-jadwal">
                                </div>
                            </div>
                        </div>

                        <div>
                            <button class="btn-submit" type="submit">+ Buat Slot Presentasi Baru</button>
                        </div>
                    </form>
                </div>
                <div id="card-DaftarkanJadwal">
                    <div>
                        <h3>Daftarkan Jadwal Kelompok</h3>
                    </div>
                    <div>
                        <div>
                            <label for="" class="text">Pilih Kelas</label>
                            <select class="input-MatkulAndKelas" name="idKelas" id="idKelas" required>
                                <option value="" disabled selected>Pilih Mata Kuliah & Kelas</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <h4>Kelompok Tugas Besar</h4>
                        <ul id="list-kelompok">
                            <li class="detailKelompok">
                                <span>Kelompok 1 - ABC</span>
                                <span>Belum Terdaftar</span>
                            </li>
                            <li class="detailKelompok">
                                <span>Kelompok 2 - BCD</span>
                                <span>Terdaftar</span>
                            </li>
                            <li class="detailKelompok">
                                <span>Kelompok 3 - CDF</span>
                                <span>Terdaftar</span>
                            </li>
                            <li class="detailKelompok">
                                <span>Kelompok 3 - CDF</span>
                                <span>Terdaftar</span>
                            </li>
                        </ul>
                    </div>
                    <div>
                        <h4>Slot Presentasi</h4>
                        <form action="">
                            <ul id="list-slotPresentasi">
                                <li class="slotPresentasi">
                                    <div>
                                        <span>18</span>
                                        <span class="bulan">Januari</span>
                                    </div>
                                    <div>
                                        <label for="" class="text">08.00 - 09.00 Lab Informatika</label>
                                        <select class="input-Kelompok" name="idKelas" id="idKelas" required>
                                            <option value="" disabled selected>Pilih Kelas</option>
                                        </select>
                                    </div>
                                </li>
                                <li class="slotPresentasi">
                                    <div>
                                        <span>18</span>
                                        <span class="bulan">Januari</span>
                                    </div>
                                    <div>
                                        <label for="" class="text">08.00 - 09.00 Lab Informatika</label>
                                        <select class="input-Kelompok" name="idKelas" id="idKelas" required>
                                            <option value="" disabled selected>Pilih Kelas</option>
                                        </select>
                                    </div>
                                </li>
                            </ul>

                            <div>
                                <button class="btn-submit" type="submit">+ Simpan dan Publikasikan</button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>

</html>
