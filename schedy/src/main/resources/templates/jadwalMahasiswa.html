<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedy - Jadwal Presentasi Tugas Besar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/jadwal.css}">
</head>

<body>
<div class="layout">

    <aside th:replace="~{fragments/layoutMahasiswa :: sidebar('jadwal')}"></aside>

    <div class="main">
        <header th:replace="~{fragments/layoutMahasiswa :: topbar}"></header>

        <main class="content">
            <h1 class="page-title">Jadwal Presentasi Tugas Besar</h1>

            <div class="jadwal-list">
                <div class="jadwal-card" th:each="j : ${jadwalList}">
                    <div class="jadwal-subtitle"
                         th:text="${j.kelompok.kelas.mataKuliah.kodeMatkul} + ' - ' + ${j.kelompok.kelas.mataKuliah.namaMatkul} + ' - Kelas ' + ${j.kelompok.kelas.namaKelas}">
                        AIF23001 - Dasar Pemrograman - Kelas a
                    </div>

                    <div class="jadwal-kelompok" th:text="${j.kelompok.namaKelompok}">
                        Kelompok 1 - ABC
                    </div>

                    <div class="jadwal-meta">
                        <div class="meta-row">
                            <span class="material-symbols-outlined">calendar_today</span>
                            <span th:text="${#temporals.format(j.slot.tanggal, 'EEEE, d MMMM yyyy')}">Jumat, 8 Oktober 2026</span>
                        </div>

                        <div class="meta-row meta-group">
                            <div class="meta-item">
                                <span class="material-symbols-outlined">schedule</span>
                                <span th:text="${#temporals.format(j.slot.jamMulai, 'HH.mm')} + '-' + ${#temporals.format(j.slot.jamSelesai, 'HH.mm')}">08.00-09.00</span>
                            </div>
                            <div class="meta-item">
                                <span class="material-symbols-outlined">school</span>
                                <span th:text="${j.slot.lokasi != null and j.slot.lokasi != '' ? j.slot.lokasi : '-'}">Lab Kom</span>
                            </div>
                        </div>

                        <div class="meta-row">
                            <span class="material-symbols-outlined">group</span>
                            <span th:text="${anggotaPerKelompok.get(j.kelompok.idKelompok) != null ? anggotaPerKelompok.get(j.kelompok.idKelompok) : '-'}">
                                Kendrick, Steven , Agus
                            </span>
                        </div>
                    </div>
                </div>

                <div class="empty-card" th:if="${#lists.isEmpty(jadwalList)}">
                    Belum ada jadwal presentasi tugas besar yang ditetapkan dosen untuk kelompok kamu di semester ini.
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
