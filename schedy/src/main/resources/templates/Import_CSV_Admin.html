<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impor Data CSV | Schedy</title>
    <link rel="stylesheet" th:href="@{/css/Import_CSV_Admin.css}">
</head>

<body>
    <aside class="sidebar">
        <a class="brand" th:href="@{/admin}" href="/admin">Schedy</a>
        <nav class="main-navigation" aria-label="Navigasi utama">
            <a class="nav-link" th:href="@{/admin}" href="/admin"><svg class="nav-icon" viewBox="0 0 16 16"
                    aria-hidden="true">
                    <rect x="1.5" y="1.5" width="5" height="5" rx=".6" />
                    <rect x="9.5" y="1.5" width="5" height="5" rx=".6" />
                    <rect x="1.5" y="9.5" width="5" height="5" rx=".6" />
                    <rect x="9.5" y="9.5" width="5" height="5" rx=".6" />
                </svg><span>Dashboard</span></a>
            <a class="nav-link" th:href="@{/admin/semester}" href="/admin/semester"><svg class="nav-icon"
                    viewBox="0 0 16 16" aria-hidden="true">
                    <rect x="2.25" y="3.5" width="11.5" height="10" rx="1" />
                    <path d="M2.5 6.5h11M5 1.75v3.5M11 1.75v3.5" />
                    <path d="M5 9h.01M8 9h.01M11 9h.01M5 11.5h.01M8 11.5h.01" />
                </svg><span>Kelola Semester</span></a>
            <a class="nav-link active" href="#import-csv"><svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M4 1.5h5l3 3v10H4z" />
                    <path d="M9 1.5v3M9 4.5h3M8 7v4M6.25 9.25 8 11l1.75-1.75M5.5 13.5h5" />
                </svg><span>Impor Data CSV</span></a>
            <a class="nav-link" th:href="@{/admin/data-akademik}" href="/admin/data-akademik"><svg class="nav-icon"
                    viewBox="0 0 16 16" aria-hidden="true">
                    <ellipse cx="8" cy="3.25" rx="5.25" ry="1.75" />
                    <path
                        d="M2.75 3.25v4C2.75 8.2 5.1 9 8 9s5.25-.8 5.25-1.75v-4M2.75 7.25v4C2.75 12.2 5.1 13 8 13s5.25-.8 5.25-1.75v-4" />
                </svg><span>Data Akademik</span></a>
        </nav>
        <a class="logout-link" th:href="@{/logout}" href="/logout"><svg class="logout-icon" viewBox="0 0 16 16"
                aria-hidden="true">
                <path d="M6.5 2H3.25A1.25 1.25 0 0 0 2 3.25v9.5A1.25 1.25 0 0 0 3.25 14h3.25M9.5 5l3 3-3 3M5.5 8h7" />
            </svg><span>Logout</span></a>
    </aside>

    <div class="page-shell">
        <header class="topbar">
            <div class="topbar-actions">
                <form id="pilih-semester-form" th:action="@{/semester/pilih}" method="post" hidden>
                    <input type="hidden" name="returnTo" th:value="@{/admin/import-csv(type=${param.type})}">
                </form>
                <label class="semester-select" for="semester-aktif"><select id="semester-aktif"
                        name="idSemester" form="pilih-semester-form" onchange="this.form.submit()"
                        th:disabled="${#lists.isEmpty(semesters)}" aria-label="Pilih semester aktif">
                           <option th:if="${#lists.isEmpty(semesters)}" value="">Belum ada semester</option>
                            <option th:each="semester : ${semesters}" th:value="${semester.idSemester}"
                                th:selected="${semester.idSemester == idSemester}"
                                th:text="${'Semester ' + semester.jenisSemester + ' ' + semester.tahunAjaran}">
                                Semester Ganjil 2024/2025
                            </option>
                    </select></label>

                <a class="profile" href="#profile" aria-label="Buka profil admin">

                    <span class="avatar" aria-hidden="true"></span>
                    <span class="profile-name">
                        <span th:text="${session.loggedUser.nama}">Nama</span>
                        <small>Admin</small>
                    </span>
                </a>

            </div>
        </header>

        <main id="import-csv" class="import-content">
            <h1>Import Data CSV</h1>
            <div class="import-tabs" role="tablist" aria-label="Jenis data CSV">
                <button class="tab active" type="button" role="tab" aria-selected="true" data-type="mahasiswa">Akun
                    Mahasiswa dan dosen</button>
                <button class="tab" type="button" role="tab" aria-selected="false" data-type="mata-kuliah">Mata
                    Kuliah</button>
                <button class="tab" type="button" role="tab" aria-selected="false" data-type="jadwal-kuliah">Jadwal
                    Kuliah</button>
                <button class="tab" type="button" role="tab" aria-selected="false" data-type="jadwal-ujian">Jadwal
                    Ujian</button>
            </div>

            <form id="csv-upload-form" class="upload-card" aria-labelledby="upload-title"
                th:action="@{/admin/import-csv}" action="/admin/import-csv" method="post" enctype="multipart/form-data">
                <input id="csv-type" type="hidden" name="type" value="mahasiswa">
                <input type="hidden" name="idSemester" th:value="${idSemester}">
                <h2 id="upload-title" class="sr-only">Unggah berkas CSV</h2>
                <input id="csv-file" name="file" type="file" accept=".csv,text/csv" hidden>
                <div id="drop-zone" class="drop-zone" role="button" tabindex="0" aria-describedby="upload-help">
                    <div class="upload-empty">
                        <span class="upload-icon" aria-hidden="true"><svg viewBox="0 0 40 40">
                                <path
                                    d="M20 27V9M13.5 15.5 20 9l6.5 6.5M9 25v5.5A2.5 2.5 0 0 0 11.5 33h17a2.5 2.5 0 0 0 2.5-2.5V25" />
                            </svg></span>
                        <p class="upload-title">Pilih file CSV dari folder perangkat anda</p>
                        <p class="upload-subtitle">atau tarik file CSV ke box ini</p>
                        <p class="upload-format">Format CSV - Ukuran Maksimum 10 MB</p>
                    </div>
                    <div class="upload-selected" hidden>
                        <div>
                            <p id="file-name" class="file-name"></p>
                            <p id="file-size" class="file-size"></p>
                        </div>
                        <button id="remove-file" type="button" aria-label="Hapus file">×</button>
                    </div>
                </div>
                <p id="upload-help" class="upload-help">Pastikan file yang diupload sudah sesuai dengan format.</p>
                <div class="upload-actions">
                    <button id="download-template" class="template-button" type="button">Download template CSV</button>
                    <button id="submit-upload" class="submit-button" type="submit" disabled>Submit</button>
                </div>
                <p id="upload-status" class="upload-status" role="status" aria-live="polite"></p>
            </form>
        </main>
    </div>
    <script th:src="@{/js/Import_CSV_Admin.js}" src="/js/Import_CSV_Admin.js" defer></script>
</body>

</html>
