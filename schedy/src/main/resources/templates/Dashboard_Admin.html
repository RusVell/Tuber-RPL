<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin | Schedy</title>
    <link rel="stylesheet" th:href="@{/css/Dashboard_Admin.css}">
</head>

<body>
    <aside class="sidebar">
        <a class="brand" href="#dashboard">Schedy</a>
        <nav class="main-navigation" aria-label="Navigasi utama">
            <a class="nav-link active" href="#dashboard">
                <svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true">
                    <rect x="1.5" y="1.5" width="5" height="5" rx=".6" />
                    <rect x="9.5" y="1.5" width="5" height="5" rx=".6" />
                    <rect x="1.5" y="9.5" width="5" height="5" rx=".6" />
                    <rect x="9.5" y="9.5" width="5" height="5" rx=".6" />
                </svg>
                <span>Dashboard</span>
            </a>
            <a class="nav-link" th:href="@{/admin/semester}">
                <svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true">
                    <rect x="2.25" y="3.5" width="11.5" height="10" rx="1" />
                    <path d="M2.5 6.5h11M5 1.75v3.5M11 1.75v3.5" />
                    <path d="M5 9h.01M8 9h.01M11 9h.01M5 11.5h.01M8 11.5h.01" />
                </svg>
                <span>Kelola Semester</span>
            </a>
            <a class="nav-link" th:href="@{/admin/import-csv}">
                <svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M4 1.5h5l3 3v10H4z" />
                    <path d="M9 1.5v3h3M8 7v4M6.25 9.25 8 11l1.75-1.75M5.5 13.5h5" />
                </svg>
                <span>Impor Data CSV</span>
            </a>
            <a class="nav-link" th:href="@{/admin/data-akademik}">
                <svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true">
                    <ellipse cx="8" cy="3.25" rx="5.25" ry="1.75" />
                    <path
                        d="M2.75 3.25v4C2.75 8.2 5.1 9 8 9s5.25-.8 5.25-1.75v-4M2.75 7.25v4C2.75 12.2 5.1 13 8 13s5.25-.8 5.25-1.75v-4" />
                </svg>
                <span>Data Akademik</span>
            </a>
        </nav>
        <a class="logout-link" th:href="@{/logout}">
            <svg class="logout-icon" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M6.5 2H3.25A1.25 1.25 0 0 0 2 3.25v9.5A1.25 1.25 0 0 0 3.25 14h3.25M9.5 5l3 3-3 3M5.5 8h7" />
            </svg>
            <span>Logout</span>
        </a>
    </aside>

    <div class="page-shell">
        <header class="topbar">
            <div class="topbar-actions">
                <form id="pilih-semester-form" th:action="@{/semester/pilih}" method="post" hidden>
                    <input type="hidden" name="returnTo" th:value="@{/admin}">
                </form>
                <label class="semester-select" for="pilihsemester">
                    <select name="idSemester" id="pilihsemester" form="pilih-semester-form"
                        aria-label="Pilih semester" onchange="this.form.submit()" th:disabled="${#lists.isEmpty(semesters)}">
                        <option th:if="${#lists.isEmpty(semesters)}" value="">Belum ada semester</option>
                            <option th:each="semester : ${semesters}" th:value="${semester.idSemester}"
                                th:selected="${semester.idSemester == idSemester}"
                                th:text="${'Semester ' + semester.jenisSemester + ' ' + semester.tahunAjaran}">
                                Semester Ganjil 2024/2025
                            </option>
                    </select>
                </label>

                <a class="profile" href="#profile" aria-label="Buka profil admin">

                    <span class="avatar" aria-hidden="true"></span>

                    <span class="profile-name">
                        <span th:text="${session.loggedUser.nama}">Nama</span>
                        <small>Admin</small>
                    </span>
                </a>

            </div>
        </header>

        <main id="dashboard" class="dashboard-content">
            <h1>Dashboard</h1>
            <section class="status-cards" aria-label="Ringkasan status kelompok">
                <article class="status-card">
                    <p>Kelompok terdaftar</p><strong th:text="${TotalKelompok}">8</strong>
                </article>
                <article class="status-card">
                    <p>Sudah Dijadwalkan</p><strong class="scheduled" th:text="${jumlahscheduled}">5</strong>
                </article>
                <article class="status-card">
                    <p>Belum Dijadwalkan</p><strong class="unscheduled" th:text="${jumlahunscheduled}">3</strong>
                </article>
            </section>

            <section class="schedule-card" aria-labelledby="schedule-title">
                <div class="schedule-heading">
                    <h2 id="schedule-title">Jadwal Presentasi</h2>
                    <label class="course-select" for="mata-kuliah">
                        <select name="mata_kuliah" id="mata-kuliah" aria-label="Filter mata kuliah">
                            <option>Semua Mata Kuliah</option>
                        </select>
                    </label>
                </div>
                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th>Hari dan tanggal</th>
                                <th>Jam</th>
                                <th>Kelompok</th>
                                <th>Mata Kuliah</th>
                                <th>Dosen</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="jadwal: ${jadwallist}">
                                <td th:text="${jadwal.hariTanggal}">Senin, 8 November</td>
                                <td th:text="${jadwal.jam}">10.00 - 10.30</td>
                                <td class="center" th:text="${jadwal.kelompok}">3</td>
                                <!-- Gunakan th:utext jika data dari backend mengandung tag HTML seperti <br> -->
                                <td th:utext="${jadwal.mataKuliah}">Rekayasa<br>Perangkat Lunak</td>
                                <td th:text="${jadwal.dosen}">Budi</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
