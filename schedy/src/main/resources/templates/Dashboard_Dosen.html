<!DOCTYPE html>
<html lang="id" xmlns="http://thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0"
        rel="stylesheet">

    <title>Document</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/Dashboard_Dosen.css}">
</head>

<body>
    <div class="layout">
        <aside th:replace="~{fragments/layoutDosen :: sidebar('Dashboard')}"></aside>

        <div class="main">
            <header th:replace="~{fragments/layoutDosen :: topbar}"></header>

            <main class="content">
                <h2>Pengelolaan Kelompok Tugas Besar</h2>

                <section id="kelola">
                    <h3>Buat Kelompok Untuk Tugas Besar</h3>
                    <form th:action="@{/dosen/dashboard/buatKelompok}" method="post" id="form">
                        <div id="input">
                            <div>
                                <div class="wrapper-input">
                                    <div class="Text">Mata Kuliah & Kelas</div>
                                    <select class="input-dosen" name="idKelas" id="idKelas" required>
                                        <option value="" disabled selected>Pilih Mata Kuliah & Kelas</option>
                                        <option th:each="kelas : ${daftarKelas}" th:value="${kelas.idKelas}"
                                            th:text="|${kelas.mataKuliah.namaMatkul} Kelas ${kelas.namaKelas}|">Mata
                                            Kuliah & Kelas</option>
                                    </select>
                                </div>
                                <div class="wrapper-input">
                                    <label class="Text" for="minAnggota">Minimal Jumlah Anggota Kelompok</label>
                                    <input type="number" min="1" max="2" class="input-dosen" id="minAnggota"
                                        name="minAnggota" placeholder="Masukkan jumlah minimal anggota kelompok"
                                        required>
                                </div>
                            </div>
                            <div>
                                <div class="wrapper-input">
                                    <label class="Text" for="namaKelompok">Nama Kelompok</label>
                                    <input type="text" minlength="3" maxlength="10" class="input-dosen"
                                        id="namaKelompok" name="namaKelompok" placeholder="Masukkan nama kelompok"
                                        required>
                                </div>
                                <div class="wrapper-input">
                                    <label class="Text" for="maxAnggota">Maximal Jumlah Anggota Kelompok</label>
                                    <input type="number" min="3" max="6" class="input-dosen" id="maxAnggota"
                                        name="maxAnggota" placeholder="Masukkan jumlah maximal anggota kelompok"
                                        required>
                                </div>
                            </div>
                        </div>

                        <div>
                            <button class="btn-tambahKelompok" type="submit">+ Tambahkan Kelompok</button>
                        </div>
                    </form>
                </section>

                <h3>Kelompok Pada Semester Aktif</h3>

                <form th:action="@{/dosen/dashboard}" method="get">
                    <div class="wrapper-input">
                        <div class="Text">Mata Kuliah &amp; Kelas</div>
                        <select class="input-dosen" name="filterIdKelas" id="filterIdKelas"
                            onchange="this.form.submit()">
                            <option value="" disabled selected>Pilih Mata Kuliah &amp; Kelas</option>
                            <option th:each="kelas : ${daftarKelas}" th:value="${kelas.idKelas}"
                                th:text="|${kelas.mataKuliah.namaMatkul} Kelas ${kelas.namaKelas}|"
                                th:selected="${kelas.idKelas == selectedIdKelas}"></option>
                        </select>
                    </div>
                </form>

                <ul id="list-kelompok">
                    <li th:each="kelompok :${daftarKelompok}" style="cursor: pointer;"
                        th:attr="data-id=${kelompok.idKelompok}"
                        th:onclick="|tampilkanDetailKelompok(${kelompok.idKelompok})|">
                        <span class="text-kelompok"
                            th:text="|${kelompok.kelas.mataKuliah.kodeMatkul} - Kelas ${kelompok.kelas.namaKelas}|">Kelas</span>
                        <h4 th:text="${kelompok.namaKelompok}">Nama Kelompok</h4>
                        <span class="text-kelompok" th:text="${kelompok.kelas.mataKuliah.namaMatkul}">Dasar
                            Pemrograman</span>
                        <span class="rules-invalid">
                            <div class="rules-wrapp"
                                th:text="${kelompok.jumlahAnggota < kelompok.minKelompok} ? |Belum Lengkap (min ${kelompok.minKelompok} Anggota)| : 'Anggota Tercukupi'"
                                th:style="${kelompok.jumlahAnggota < kelompok.minKelompok} ? 'background-color: #F3DA4D;' : 'background-color: #c8eec4;'">
                                Anggota Masih kurang
                            </div>
                        </span>
                    </li>
                </ul>

                <dialog id="detailKelompok">
                    <div>
                        <button class="close-btn" type="button" onclick="document.getElementById('detailKelompok').close()">X</button>
                    </div>
                    <div>
                        <span id="nama-kelompok">Daftar Anggota Kelompok</span>
                    </div>
                    <ul id="list-anggota"></ul>
                </dialog>
            </main>
        </div>
    </div>

    <script>
        document.getElementById('form').addEventListener('submit', function (e) {
            e.preventDefault();
            alert('Kelompok Berhasil Ditambahkan');
        });

        const daftarAnggota = document.getElementById('list-anggota');
        const namaKelompok = document.getElementById('nama-kelompok');

        function tambahAnggota(anggota) {
            const li = document.createElement('li');
            li.textContent = `${anggota.npm} - ${anggota.nama}`;
            daftarAnggota.appendChild(li);
        }

        //jika gagal mengambil data anggota atau jika kelompok masih kosong
        function tambahPemberitahuan(pesan) {
            const li = document.createElement('li');
            li.textContent = pesan;
            daftarAnggota.appendChild(li);
        }

        async function tampilkanDetailKelompok(idKelompok) {
            daftarAnggota.innerHTML = '';
            const getNamaKelompok = document.querySelector(`li[data-id="${idKelompok}"] > h4`).textContent;

            document.getElementById('detailKelompok').showModal();
            namaKelompok.textContent = getNamaKelompok;

            try {
                const respon = await fetch(`/dosen/detailKelompok/${idKelompok}`)
                if (!respon.ok) throw new Error('Status ' + respon.status);
                const anggotaKelompok = await respon.json();

                if (anggotaKelompok.length === 0) {
                    tambahPemberitahuan("Belum Ada Anggota");
                    return;
                }

                anggotaKelompok.forEach(a => tambahAnggota(a));
            } catch (err) {
                tambahPemberitahuan("Gagal memuat anggota");
            }
        }
    </script>
</body>

</html>
