spring.application.name=schedy
# Koneksi Database Microsoft SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=schedy_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Admin123
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Konfigurasi Hibernate / JPA
# Menggunakan 'update' agar Spring Boot tidak menghapus tabel dan data dummy yang sudah dibuat
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Bahasa Indonesia buat format tanggal (Senin, 8 Oktober 2026)
spring.web.locale=id_ID
spring.web.locale-resolver=fixed
spring.jpa.properties.hibernate.format_sql=true


# Batas file CSV
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB